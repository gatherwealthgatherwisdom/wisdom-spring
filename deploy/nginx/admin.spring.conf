# Admin SPA: https://admin.spring.gwgwgroup-it.com
# Static files + same-origin /v1, /admin, and /health to the API on 3009.
# Install: sudo cp deploy/nginx/admin.spring.conf /etc/nginx/sites-available/admin.spring
#          sudo ln -s /etc/nginx/sites-available/admin.spring /etc/nginx/sites-enabled/admin.spring
# Do not change default_server or other vhosts.

server {
    listen 80;
    listen [::]:80;
    server_name admin.spring.gwgwgroup-it.com;

    root /home/app/wisdom-spring/apps/admin/dist;
    index index.html;

    access_log /var/log/nginx/spring-admin.access.log;
    error_log  /var/log/nginx/spring-admin.error.log;

    client_max_body_size 8m;

    location ^~ /health {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /home/app/wisdom-spring/deploy/nginx/proxy-sse.conf;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /home/app/wisdom-spring/deploy/nginx/proxy-sse.conf;
    }

    location ^~ /admin {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /home/app/wisdom-spring/deploy/nginx/proxy-sse.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
