# API: https://spring.gwgwgroup-it.com → 127.0.0.1:3009
# Install: sudo cp deploy/nginx/spring.conf /etc/nginx/sites-available/spring
#          sudo ln -s /etc/nginx/sites-available/spring /etc/nginx/sites-enabled/spring
# Then certbot --nginx. Do not change default_server or other vhosts.

server {
    listen 80;
    listen [::]:80;
    server_name spring.gwgwgroup-it.com;

    access_log /var/log/nginx/spring.access.log;
    error_log  /var/log/nginx/spring.error.log;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /home/app/wisdom-spring/deploy/nginx/proxy-sse.conf;
    }
}
